<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL stage; HUD pinned top, caption + dock stacked at the bottom. Single deliberate dark look (deep space). */
:root {
  --void: #04060c;
  --ink: #dce6f3;
  --dim: #7d8aa3;
  --ember: #ffb562;
  --rule: rgba(220, 230, 243, 0.16);
  --veil: rgba(4, 6, 12, 0.55);
  --display: 'Chakra Petch', 'Avenir Next Condensed', 'Arial Narrow', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--ink); font-family: var(--mono); overflow: hidden; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.hud {
  position: fixed; left: 0; right: 0;
  top: env(safe-area-inset-top, 0px);
  padding: 16px;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap;
  pointer-events: none;
}
.mark { font-family: var(--display); font-weight: 600; font-size: 1.1rem; letter-spacing: 0.45em; margin: 0; }
.mark small { display: block; margin-top: 6px; font-family: var(--mono); font-weight: 400; font-size: 0.66rem; letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; }
.readout { display: grid; grid-template-columns: auto auto; gap: 4px 14px; margin: 0; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; }
.readout div { display: contents; }
.readout dt { color: var(--dim); }
.readout dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.readout dd.live { color: var(--ember); }

.bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  pointer-events: none;
}
.caption {
  margin: 0; max-width: 38rem; min-height: 3em;
  text-align: center; font-size: 1rem; line-height: 1.5; text-wrap: balance;
  color: var(--ink);
}
.caption .w { opacity: 0.2; transition: opacity 0.12s linear; }
.caption .w.on { opacity: 1; }
.caption.rest { color: var(--dim); font-size: 0.85rem; }

.dock { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 10px 18px; pointer-events: auto; }
.group { display: flex; flex-direction: column; gap: 6px; }
.group > span { font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
button {
  font-family: var(--display); font-weight: 500; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink); background: var(--veil); border: 1px solid var(--rule); border-radius: 2px;
  padding: 9px 13px; cursor: pointer;
  transition: border-color 0.15s, background 0.15s, color 0.15s;
}
button:hover { border-color: var(--ink); }
button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
button[aria-pressed="true"] { background: rgba(220, 230, 243, 0.12); border-color: var(--ink); }
button.primary { color: var(--ember); border-color: var(--ember); padding: 11px 20px; font-size: 0.8rem; }
button.primary:hover { background: rgba(255, 181, 98, 0.1); }
.note { margin: 0; font-size: 0.62rem; letter-spacing: 0.1em; color: var(--dim); text-align: center; }

@media (max-width: 560px) {
  .dock { gap: 10px; }
  button { padding: 8px 10px; font-size: 0.66rem; }
  .caption { font-size: 0.92rem; }
}
</style>
</head>
<body>

<canvas id="stage" aria-label="Nova, a cloud of light particles"></canvas>

<header class="hud">
  <p class="mark">NOVA<small>Form study 01</small></p>
  <dl class="readout">
    <div><dt>State</dt><dd id="r-state" class="live">Nebula</dd></div>
    <div><dt>Expression</dt><dd id="r-expr">Neutral</dd></div>
    <div><dt>Voice</dt><dd id="r-voice">Silent</dd></div>
    <div><dt>Particles</dt><dd id="r-n">0</dd></div>
  </dl>
</header>

<section class="bottom">
  <p class="caption rest" id="caption" aria-live="polite">At rest. Press Wake Nova to watch it form, speak and change shape.</p>
  <div class="dock">
    <button id="wake" class="primary">Wake Nova</button>
    <div class="group" role="group" aria-label="Shape">
      <span>Shape</span>
      <div class="row">
        <button data-mode="nebula" aria-pressed="true">Nebula</button>
        <button data-mode="face" aria-pressed="false">Face</button>
        <button data-mode="tree" aria-pressed="false">Tree</button>
      </div>
    </div>
    <div class="group" role="group" aria-label="Expression">
      <span>Expression</span>
      <div class="row">
        <button data-expr="neutral" aria-pressed="true">Neutral</button>
        <button data-expr="warm" aria-pressed="false">Warm</button>
        <button data-expr="curious" aria-pressed="false">Curious</button>
        <button data-expr="thinking" aria-pressed="false">Thinking</button>
      </div>
    </div>
    <div class="group" role="group" aria-label="Voice">
      <span>Voice</span>
      <div class="row">
        <button id="line">Test line</button>
        <button id="sound" aria-pressed="true">Sound on</button>
      </div>
    </div>
  </div>
  <p class="note">Prototype. Placeholder voice: a synthesised babble, not words. No AI connected.</p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var N = Math.min(window.innerWidth, window.innerHeight) < 600 ? 9000 : 16000;
  document.getElementById('r-n').textContent = N.toLocaleString('en-GB');

  // Seeded random so the shapes are the same on every load
  function rngFrom(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var R = rngFrom(7);
  function gauss() { var u = 0; while (!u) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * R()); }

  // ---------- Index layout (face groups) ----------
  var C = { eye: Math.round(N * 0.035), brow: Math.round(N * 0.016), mouth: Math.round(N * 0.045), halo: Math.round(N * 0.12) };
  var I = {}, o = 0;
  I.eyeL = [o, o += C.eye]; I.eyeR = [o, o += C.eye];
  I.browL = [o, o += C.brow]; I.browR = [o, o += C.brow];
  I.mouth = [o, o += C.mouth]; I.halo = [o, o += C.halo]; I.shell = [o, N];
  var FEATURE_END = I.halo[0];

  var P1 = new Float32Array(N), P2 = new Float32Array(N), P3 = new Float32Array(N), P4 = new Float32Array(N);
  var PH = new Float32Array(N), RATE = new Float32Array(N);
  for (var i = 0; i < N; i++) { PH[i] = R() * Math.PI * 2; RATE[i] = 0.016 + R() * 0.05; }

  // ---------- Head geometry ----------
  var HA = 2.3, HB = 3.0, HC = 2.0;
  var EYE_X = 0.95, EYE_Y = 0.55;
  function taper(y) { return y < -0.6 ? 1 - 0.38 * Math.min(1, (-0.6 - y) / 2.4) : 1; }
  function socket(x, y) {
    var d1 = (x - EYE_X) * (x - EYE_X) + (y - EYE_Y) * (y - EYE_Y);
    var d2 = (x + EYE_X) * (x + EYE_X) + (y - EYE_Y) * (y - EYE_Y);
    return 0.45 * (Math.exp(-d1 / 0.2) + Math.exp(-d2 / 0.2));
  }
  function surfZ(x, y) {
    var s = 1 - (y / HB) * (y / HB); if (s <= 0) return 0;
    var ax = HA * taper(y) * Math.sqrt(s);
    var q = 1 - (x / ax) * (x / ax);
    return q > 0 ? HC * Math.sqrt(s) * Math.sqrt(q) : 0;
  }
  var EYE_Z = surfZ(EYE_X, EYE_Y) - 0.3;

  var FACE = new Float32Array(N * 3);
  var COL = new Float32Array(N * 3);
  function setCol(i, r, g, b) { COL[i * 3] = r; COL[i * 3 + 1] = g; COL[i * 3 + 2] = b; }

  // Shell: topographic contour rings across the front of the head
  (function () {
    var a = I.shell[0], b = I.shell[1], count = b - a, RINGS = 34, w = [], tot = 0, k, r;
    for (r = 0; r < RINGS; r++) {
      var y = -2.85 + (5.75 * r) / (RINGS - 1);
      var s = Math.sqrt(Math.max(0, 1 - (y / HB) * (y / HB)));
      w.push(s * taper(y) + 0.05); tot += s * taper(y) + 0.05;
    }
    var idx = a;
    for (r = 0; r < RINGS && idx < b; r++) {
      var yr = -2.85 + (5.75 * r) / (RINGS - 1);
      var n = r === RINGS - 1 ? b - idx : Math.round(count * w[r] / tot);
      for (k = 0; k < n && idx < b; k++, idx++) {
        var th = (R() * 2 - 1) * 1.95;
        var y2 = yr + gauss() * 0.012;
        var ss = Math.sqrt(Math.max(0, 1 - (y2 / HB) * (y2 / HB)));
        var x = HA * taper(y2) * ss * Math.sin(th);
        var z = HC * ss * Math.cos(th) - socket(x, y2);
        FACE[idx * 3] = x; FACE[idx * 3 + 1] = y2; FACE[idx * 3 + 2] = z;
        var lit = 0.16 + 0.26 * Math.pow(Math.max(0, Math.cos(th)), 0.6);
        setCol(idx, lit * 0.78, lit * 0.9, lit * 1.15);
      }
    }
    for (; idx < b; idx++) { FACE[idx * 3 + 1] = -3; setCol(idx, 0.12, 0.14, 0.2); }
  })();

  // Eyes, brows, mouth, halo: store per-point parameters, positions computed each frame
  [I.eyeL, I.eyeR].forEach(function (rg) {
    for (var i = rg[0]; i < rg[1]; i++) {
      var ring = R() < 0.6;
      P1[i] = R() * Math.PI * 2; P2[i] = ring ? 0 : 1;
      P3[i] = ring ? gauss() * 0.02 : Math.abs(gauss()) * 0.08;
      if (ring) setCol(i, 0.85, 0.6, 0.34); else setCol(i, 1.0, 0.78, 0.5);
    }
  });
  [I.browL, I.browR].forEach(function (rg) {
    for (var i = rg[0]; i < rg[1]; i++) { P1[i] = R(); P2[i] = gauss() * 0.025; setCol(i, 0.62, 0.72, 0.9); }
  });
  for (i = I.mouth[0]; i < I.mouth[1]; i++) {
    P1[i] = (R() * 2 - 1); P2[i] = R() < 0.5 ? -1 : 1; P3[i] = gauss() * 0.02; setCol(i, 0.9, 0.72, 0.52);
  }
  for (i = I.halo[0]; i < I.halo[1]; i++) {
    P1[i] = R() * Math.PI * 2; P2[i] = 4.3 + gauss() * 0.22; P3[i] = gauss() * 0.1; P4[i] = 0.05 + R() * 0.08;
    var hl = 0.12 + R() * 0.16; setCol(i, hl * 0.8, hl * 0.9, hl * 1.2);
  }

  // ---------- Nebula ----------
  var NEB = new Float32Array(N * 3);
  for (i = 0; i < N; i++) {
    var x, y, z;
    if (R() < 0.72) {
      var arm = Math.floor(R() * 3), rr = 1 + 9 * Math.pow(R(), 0.75);
      var ang = arm * 2.094 + rr * 0.42 + gauss() * 0.32;
      x = rr * Math.cos(ang); z = rr * Math.sin(ang) * 0.7; y = gauss() * (0.35 + rr * 0.06);
    } else {
      x = gauss() * 7; y = gauss() * 3.6; z = gauss() * 4;
    }
    var tl = 0.55, cy = Math.cos(tl), sy = Math.sin(tl);
    NEB[i * 3] = x; NEB[i * 3 + 1] = y * cy - z * sy; NEB[i * 3 + 2] = y * sy + z * cy;
  }

  // ---------- Tree ----------
  var TREE = new Float32Array(N * 3);
  (function () {
    var segs = [], tips = [];
    function norm(v) { var l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }
    function branch(p, d, len, th, depth, up) {
      var e = [p[0] + d[0] * len, p[1] + d[1] * len, p[2] + d[2] * len];
      segs.push({ a: p, b: e, th: th, len: len });
      if (depth === 0) { tips.push(e); return; }
      var n = depth > 3 ? 2 : 3;
      for (var k = 0; k < n; k++) {
        var nd = norm([d[0] + gauss() * 0.55, d[1] + gauss() * 0.3 + up, d[2] + gauss() * 0.55]);
        branch(e, nd, len * 0.74, th * 0.66, depth - 1, up);
      }
    }
    branch([0, -3.4, 0], [0, 1, 0], 2.1, 1, 6, 0.28);
    for (var k = 0; k < 5; k++) {
      var a = k * 1.256 + R() * 0.4;
      branch([0, -3.4, 0], norm([Math.cos(a), -0.6, Math.sin(a)]), 0.9, 0.55, 2, -0.35);
    }
    var minY = 1e9, maxY = -1e9;
    segs.forEach(function (s) { minY = Math.min(minY, s.a[1], s.b[1]); maxY = Math.max(maxY, s.b[1]); });
    tips.forEach(function (t) { maxY = Math.max(maxY, t[1] + 0.4); });
    var sc = 7 / (maxY - minY), mid = (maxY + minY) / 2;
    var wood = Math.floor(N * 0.5), wsum = 0;
    segs.forEach(function (s) { wsum += s.len * (0.25 + s.th); });
    var idx = 0;
    segs.forEach(function (s) {
      var n = Math.round(wood * s.len * (0.25 + s.th) / wsum);
      for (var j = 0; j < n && idx < N; j++, idx++) {
        var u = R(), rad = s.th * 0.14;
        TREE[idx * 3] = (s.a[0] + (s.b[0] - s.a[0]) * u + gauss() * rad) * sc;
        TREE[idx * 3 + 1] = (s.a[1] + (s.b[1] - s.a[1]) * u + gauss() * rad - mid) * sc;
        TREE[idx * 3 + 2] = (s.a[2] + (s.b[2] - s.a[2]) * u + gauss() * rad) * sc;
      }
    });
    for (; idx < N; idx++) {
      var t = tips[Math.floor(R() * tips.length)];
      TREE[idx * 3] = (t[0] + gauss() * 0.32) * sc;
      TREE[idx * 3 + 1] = (t[1] + gauss() * 0.28 - mid) * sc;
      TREE[idx * 3 + 2] = (t[2] + gauss() * 0.32) * sc;
    }
    // Shuffle tree slots so particles from every face group spread across the whole tree
    for (var m = N - 1; m > 0; m--) {
      var q = Math.floor(R() * (m + 1));
      for (var c = 0; c < 3; c++) { var tmp = TREE[m * 3 + c]; TREE[m * 3 + c] = TREE[q * 3 + c]; TREE[q * 3 + c] = tmp; }
    }
  })();

  // ---------- Three.js scene ----------
  var canvas = document.getElementById('stage');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, alpha: false });
  renderer.setClearColor(0x04060c, 1);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  var baseZ = 16;
  function resize() {
    var w = window.innerWidth, h = window.innerHeight, asp = w / h;
    renderer.setSize(w, h, false);
    camera.aspect = asp;
    baseZ = asp < 0.75 ? Math.min(26, 16 * 0.75 / asp) : 16;
    camera.updateProjectionMatrix();
  }
  resize(); window.addEventListener('resize', resize);

  var sprite = document.createElement('canvas'); sprite.width = sprite.height = 64;
  var sx = sprite.getContext('2d'), grd = sx.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.25, 'rgba(255,255,255,0.75)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
  sx.fillStyle = grd; sx.fillRect(0, 0, 64, 64);

  var POS = new Float32Array(N * 3);
  for (i = 0; i < N * 3; i++) POS[i] = NEB[i];
  var geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(POS, 3));
  geom.setAttribute('color', new THREE.BufferAttribute(COL, 3));
  var mat = new THREE.PointsMaterial({
    size: N > 10000 ? 0.075 : 0.09, map: new THREE.CanvasTexture(sprite), vertexColors: true,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  var points = new THREE.Points(geom, mat);
  scene.add(points);

  // ---------- State ----------
  var mode = 'nebula', modeT = 0, clock = 0;
  var EXPR = {
    neutral:  { smile: 0.05, browL: 0, browR: 0, tilt: 0, eye: 1, gx: null, gy: null },
    warm:     { smile: 0.55, browL: 0.08, browR: 0.08, tilt: 0, eye: 0.78, gx: null, gy: null },
    curious:  { smile: 0.12, browL: 0.34, browR: -0.02, tilt: 0.1, eye: 1.08, gx: null, gy: null },
    thinking: { smile: -0.12, browL: -0.08, browR: 0.2, tilt: -0.08, eye: 0.9, gx: -1, gy: 1 }
  };
  var exprName = 'neutral';
  var cur = { smile: 0.05, browL: 0, browR: 0, tilt: 0, eye: 1 };
  var gaze = { x: 0, y: 0, tx: 0, ty: 0, next: 2 };
  var blinkAt = 3, blinkV = 1;
  var env = 0, envS = 0;
  var mouse = { x: 0, y: 0 };
  window.addEventListener('pointermove', function (e) {
    mouse.x = e.clientX / window.innerWidth * 2 - 1; mouse.y = e.clientY / window.innerHeight * 2 - 1;
  });

  var el = {
    state: document.getElementById('r-state'), expr: document.getElementById('r-expr'), voice: document.getElementById('r-voice'),
    caption: document.getElementById('caption'), wake: document.getElementById('wake'), sound: document.getElementById('sound')
  };
  var LABEL = { nebula: 'Nebula', face: 'Face', tree: 'Tree' };

  function setMode(m) {
    if (m === mode) return;
    mode = m; modeT = clock;
    el.state.textContent = LABEL[m];
    document.querySelectorAll('[data-mode]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === m)); });
    el.wake.textContent = m === 'nebula' ? 'Wake Nova' : 'Dissolve';
  }
  function setExpr(n) {
    exprName = n;
    el.expr.textContent = n.charAt(0).toUpperCase() + n.slice(1);
    document.querySelectorAll('[data-expr]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.expr === n)); });
  }
  function restCaption(text) {
    el.caption.className = 'caption rest'; el.caption.textContent = text;
  }

  // ---------- Placeholder voice: syllable envelope, optional formant buzz ----------
  var speech = null, soundOn = true, ac = null, gainNode, f1, f2, osc;
  function ensureAudio() {
    if (!ac) initAudio();
    if (ac && ac.state === 'suspended') ac.resume();
  }
  // Any button press counts as the user gesture browsers need before audio can play
  document.addEventListener('click', function (e) { if (e.target.closest('button')) ensureAudio(); }, true);
  var VOWELS = [[730, 1090], [270, 2290], [300, 870], [530, 1840], [640, 1190], [490, 1350]];
  function initAudio() {
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    osc = ac.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = 118;
    var lfo = ac.createOscillator(); lfo.frequency.value = 5.2;
    var lg = ac.createGain(); lg.gain.value = 3; lfo.connect(lg); lg.connect(osc.frequency);
    f1 = ac.createBiquadFilter(); f1.type = 'bandpass'; f1.Q.value = 7;
    f2 = ac.createBiquadFilter(); f2.type = 'bandpass'; f2.Q.value = 9;
    gainNode = ac.createGain(); gainNode.gain.value = 0;
    var body = ac.createBiquadFilter(); body.type = 'lowpass'; body.frequency.value = 900;
    var bodyGain = ac.createGain(); bodyGain.gain.value = 0.35;
    var makeup = ac.createGain(); makeup.gain.value = 3.2;
    osc.connect(f1); osc.connect(f2); osc.connect(body); body.connect(bodyGain);
    f1.connect(makeup); f2.connect(makeup); bodyGain.connect(makeup); makeup.connect(gainNode);
    var comp = ac.createDynamicsCompressor(); gainNode.connect(comp); comp.connect(ac.destination);
    osc.start(); lfo.start();
  }
  function speak(text) {
    return new Promise(function (resolve) {
      var words = text.split(/\s+/), tl = [], cursor = 0.15;
      words.forEach(function (w, wi) {
        var syl = Math.max(1, (w.toLowerCase().match(/[aeiouy]+/g) || []).length);
        for (var s = 0; s < syl; s++) {
          var d = 0.13 + Math.random() * 0.09;
          tl.push({ s: cursor, d: d, a: 0.55 + Math.random() * 0.45, w: wi, v: Math.floor(Math.random() * VOWELS.length) });
          cursor += d * 0.92;
        }
        cursor += 0.05;
        if (/[,;]$/.test(w)) cursor += 0.22;
        if (/[.!?]$/.test(w)) cursor += 0.38;
      });
      el.caption.className = 'caption';
      el.caption.innerHTML = '';
      var spans = words.map(function (w) {
        var sp = document.createElement('span'); sp.className = 'w'; sp.textContent = w;
        el.caption.appendChild(sp); el.caption.appendChild(document.createTextNode(' '));
        return sp;
      });
      speech = { tl: tl, t0: clock, end: cursor + 0.15, k: 0, spans: spans, shown: -1, lastV: -1, resolve: resolve };
      el.voice.textContent = 'Speaking'; el.voice.classList.add('live');
    });
  }
  function endSpeech() {
    if (!speech) return;
    var r = speech.resolve; speech = null; env = 0;
    el.voice.textContent = 'Silent'; el.voice.classList.remove('live');
    r();
  }
  function updateSpeech() {
    env = 0;
    if (!speech) return;
    var ts = clock - speech.t0, tl = speech.tl;
    while (speech.k < tl.length && tl[speech.k].s + tl[speech.k].d < ts) speech.k++;
    var syl = tl[speech.k];
    if (syl && ts >= syl.s) {
      env = syl.a * Math.pow(Math.sin(Math.PI * (ts - syl.s) / syl.d), 0.6);
      if (syl.w > speech.shown) { for (var w = speech.shown + 1; w <= syl.w; w++) speech.spans[w].classList.add('on'); speech.shown = syl.w; }
      if (ac && syl.v !== speech.lastV) {
        speech.lastV = syl.v;
        f1.frequency.setTargetAtTime(VOWELS[syl.v][0], ac.currentTime, 0.03);
        f2.frequency.setTargetAtTime(VOWELS[syl.v][1], ac.currentTime, 0.03);
        osc.frequency.setTargetAtTime(108 + syl.a * 22, ac.currentTime, 0.05);
      }
    }
    if (ts > speech.end) { speech.spans.forEach(function (s) { s.classList.add('on'); }); endSpeech(); }
  }

  // ---------- Face update (dynamic groups) ----------
  function lerp(a, b, k) { return a + (b - a) * k; }
  function updateFace(dt) {
    var tgt = EXPR[exprName], k = 1 - Math.pow(0.04, dt);
    cur.smile = lerp(cur.smile, tgt.smile, k); cur.browL = lerp(cur.browL, tgt.browL, k);
    cur.browR = lerp(cur.browR, tgt.browR, k); cur.tilt = lerp(cur.tilt, tgt.tilt, k); cur.eye = lerp(cur.eye, tgt.eye, k);

    // gaze wander, unless the expression fixes it
    if (tgt.gx !== null) { gaze.tx = tgt.gx; gaze.ty = tgt.gy; }
    else if (clock > gaze.next) { gaze.tx = (Math.random() * 2 - 1) * 0.8; gaze.ty = (Math.random() * 2 - 1) * 0.5; gaze.next = clock + 1.4 + Math.random() * 2.6; }
    gaze.x = lerp(gaze.x, gaze.tx, 1 - Math.pow(0.002, dt)); gaze.y = lerp(gaze.y, gaze.ty, 1 - Math.pow(0.002, dt));

    // blink
    var bt = clock - blinkAt;
    if (bt > 0 && bt < 0.16) blinkV = 1 - 0.92 * Math.sin(Math.PI * bt / 0.16);
    else { blinkV = 1; if (bt >= 0.16) blinkAt = clock + 2.4 + Math.random() * 3.2; }

    envS += (env - envS) * Math.min(1, dt * 28);
    var open = cur.eye * blinkV, i, side, rg;

    for (side = -1; side <= 1; side += 2) {
      rg = side < 0 ? I.eyeL : I.eyeR;
      var ex = side * EYE_X, gx = gaze.x * 0.12, gy = gaze.y * 0.08;
      for (i = rg[0]; i < rg[1]; i++) {
        var a = P1[i] + (P2[i] ? clock * 0.6 : 0), r;
        if (P2[i] === 0) {
          r = 0.4 + P3[i];
          FACE[i * 3] = ex + Math.cos(a) * r; FACE[i * 3 + 1] = EYE_Y + Math.sin(a) * r * open; FACE[i * 3 + 2] = EYE_Z + 0.05;
        } else {
          r = P3[i];
          FACE[i * 3] = ex + gx + Math.cos(a) * r; FACE[i * 3 + 1] = EYE_Y + gy + Math.sin(a) * r * Math.max(open, 0.12); FACE[i * 3 + 2] = EYE_Z + 0.14;
        }
      }
      rg = side < 0 ? I.browL : I.browR;
      var lift = side < 0 ? cur.browL : cur.browR;
      for (i = rg[0]; i < rg[1]; i++) {
        var u = P1[i], bx = side * (0.42 + 1.05 * u);
        FACE[i * 3] = bx;
        FACE[i * 3 + 1] = 1.32 + lift + 0.14 * Math.sin(Math.PI * u) + cur.tilt * (u - 0.5) + P2[i];
        FACE[i * 3 + 2] = surfZ(bx, 1.3) + 0.12;
      }
    }
    var mOpen = envS * 1.0 + 0.015, base = -1.45;
    for (i = I.mouth[0]; i < I.mouth[1]; i++) {
      var mu = P1[i], mx = mu * 0.72 * (1 + 0.12 * cur.smile);
      FACE[i * 3] = mx;
      FACE[i * 3 + 1] = base + cur.smile * 0.32 * mu * mu + P2[i] * mOpen * 0.45 * Math.sqrt(1 - mu * mu) + P3[i];
      FACE[i * 3 + 2] = surfZ(mx, base) + 0.1;
    }
    var ct = Math.cos(0.42), st = Math.sin(0.42), cz = Math.cos(0.18), sz = Math.sin(0.18);
    for (i = I.halo[0]; i < I.halo[1]; i++) {
      var ha = P1[i] + clock * P4[i] * (reduce ? 0.4 : 1), hr = P2[i];
      var hx = hr * Math.cos(ha), hz = hr * Math.sin(ha), hy = P3[i];
      var y1 = hy * ct - hz * st, z1 = hy * st + hz * ct;
      FACE[i * 3] = hx * cz - y1 * sz; FACE[i * 3 + 1] = hx * sz + y1 * cz; FACE[i * 3 + 2] = z1;
    }
  }

  // ---------- Frame loop ----------
  var last = performance.now() / 1000, rotY = 0;
  function frame(nowMs) {
    var now = nowMs / 1000, dt = Math.min(0.05, now - last); last = now; clock += dt;
    updateSpeech();
    updateFace(dt);

    var speed = reduce ? 0.4 : 1;
    var aN = clock * 0.025 * speed, cN = Math.cos(aN), sN = Math.sin(aN);
    var aT = (clock - modeT) * 0.22 * speed, cT = Math.cos(aT), sT = Math.sin(aT);
    var ramp = mode === 'face' ? Math.min(1, Math.max(0, (clock - modeT - 1.6) / 1.2)) : 0;
    var shimmer = reduce ? 0.004 : 0.012, t2 = clock * 2;
    var f60 = dt * 60;

    for (var i = 0, j = 0; i < N; i++, j += 3) {
      var tx, ty, tz, bx, by, bz;
      if (mode === 'nebula') {
        bx = NEB[j]; by = NEB[j + 1]; bz = NEB[j + 2];
        tx = bx * cN - bz * sN; tz = bx * sN + bz * cN; ty = by + Math.sin(clock * 0.35 + PH[i]) * 0.22 * speed;
      } else if (mode === 'tree') {
        bx = TREE[j]; by = TREE[j + 1]; bz = TREE[j + 2];
        tx = bx * cT - bz * sT; tz = bx * sT + bz * cT; ty = by + Math.sin(t2 + PH[i]) * shimmer;
      } else {
        tx = FACE[j]; ty = FACE[j + 1] + Math.sin(t2 + PH[i]) * shimmer; tz = FACE[j + 2];
      }
      var rate = RATE[i];
      if (i < FEATURE_END && ramp > 0) rate = rate + (0.45 - rate) * ramp;
      var k = 1 - Math.pow(1 - rate, f60);
      POS[j] += (tx - POS[j]) * k; POS[j + 1] += (ty - POS[j + 1]) * k; POS[j + 2] += (tz - POS[j + 2]) * k;
    }
    geom.attributes.position.needsUpdate = true;

    var wantY = mode === 'face' ? 0.12 * Math.sin(clock * 0.4) + mouse.x * 0.22 : 0;
    rotY += (wantY - rotY) * Math.min(1, dt * 2);
    points.rotation.y = rotY;
    points.rotation.x += ((mode === 'face' ? mouse.y * 0.08 : 0) - points.rotation.x) * Math.min(1, dt * 2);
    camera.position.x += (mouse.x * 0.6 - camera.position.x) * Math.min(1, dt * 1.5);
    camera.position.y += (-mouse.y * 0.4 - camera.position.y) * Math.min(1, dt * 1.5);
    camera.position.z = baseZ;
    camera.lookAt(0, 0, 0);

    if (ac) gainNode.gain.setTargetAtTime(soundOn ? envS * 0.8 : 0, ac.currentTime, 0.02);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- Scripted sequence ----------
  var seqId = 0;
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function stopAll() { seqId++; endSpeech(); }
  async function runSequence() {
    var id = ++seqId; function alive() { return id === seqId; }
    setExpr('neutral'); setMode('face'); restCaption('Forming…');
    await sleep(3000); if (!alive()) return;
    setExpr('warm'); await speak("Hello. I'm Nova."); if (!alive()) return;
    await sleep(350); if (!alive()) return;
    setExpr('neutral'); await speak("I'm not a person. I'm a voice, and a cloud of light that takes whatever shape helps."); if (!alive()) return;
    setExpr('curious'); await speak("Say we're talking about trees."); if (!alive()) return;
    setMode('tree'); await sleep(1400); if (!alive()) return;
    await speak("Roots below. A trunk to carry the weight. A canopy reaching for the light."); if (!alive()) return;
    await sleep(1600); if (!alive()) return;
    setExpr('warm'); setMode('face'); restCaption('Returning…');
    await sleep(2600); if (!alive()) return;
    await speak("And then I come back to you."); if (!alive()) return;
    setExpr('thinking'); restCaption('Listening.');
    await sleep(1800); if (!alive()) return;
    setExpr('neutral');
  }

  el.wake.addEventListener('click', function () {
    if (mode === 'nebula') runSequence();
    else { stopAll(); setExpr('neutral'); setMode('nebula'); restCaption('At rest. Press Wake Nova to watch it form, speak and change shape.'); }
  });
  document.querySelectorAll('[data-mode]').forEach(function (b) {
    b.addEventListener('click', function () {
      stopAll(); setMode(b.dataset.mode);
      restCaption(b.dataset.mode === 'nebula' ? 'At rest.' : b.dataset.mode === 'tree' ? 'Showing a tree.' : 'Listening.');
    });
  });
  document.querySelectorAll('[data-expr]').forEach(function (b) {
    b.addEventListener('click', function () { setExpr(b.dataset.expr); });
  });
  document.getElementById('line').addEventListener('click', async function () {
    stopAll(); var id = seqId;
    if (mode !== 'face') { setMode('face'); restCaption('Forming…'); await sleep(2800); if (id !== seqId) return; }
    speak("This is a test line, so you can watch the mouth follow the voice.");
  });
  el.sound.addEventListener('click', function () {
    soundOn = !soundOn;
    el.sound.setAttribute('aria-pressed', String(soundOn));
    el.sound.textContent = soundOn ? 'Sound on' : 'Sound off';
  });
})();
</script>

</body>
