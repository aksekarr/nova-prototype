<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Seni · Expression preview</title>
  <link rel="stylesheet" href="./css/nova.css">
  <script type="importmap">{"imports":{"three":"./js/vendor/three.module.js","three/addons/":"./js/vendor/addons/"}}</script>
  <style>
    .qa { position:fixed; z-index:10; left:20px; top:16px; right:20px; font:13px system-ui; color:#ddd }
    fieldset.qa { border:0; padding:0; margin:0; min-width:0 }
    .qa p { max-width:380px; line-height:1.4 }
    .qa nav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px }
    .qa button, .qa select { padding:8px 10px; font:inherit }
    .qa select { background:#10121b; color:#eee; border:1px solid #343641; margin-left:8px; max-width:72% }
    .controls { position:fixed; left:20px; bottom:16px; width:280px; max-height:calc(100vh - 165px); overflow:auto;
      background:rgba(4,6,12,.87); padding:12px; border:1px solid #252731; border-radius:6px }
    .controls button { font-size:11px }
    .timing-comparison { border-bottom:1px solid #343641; margin-bottom:10px; padding-bottom:8px }
    .timing-comparison h2 { font-size:13px; font-weight:500; margin:0 0 8px }
    .timing-options { display:flex; gap:8px 16px; flex-wrap:wrap; margin-bottom:8px; font-size:12px }
    .timing-comparison p { max-width:none; margin:5px 0; font-size:11px; color:#aeb6c8 }
    #timing-status { color:#ddd; min-height:1.4em }
    #metrics { white-space:pre-wrap; max-width:330px; font-size:12px }
    h1 { font-size:16px; font-weight:500; margin:0 0 12px }
    summary { cursor:pointer; padding:6px 0 }
    @media (max-width:900px) {
      .controls { width:auto; right:20px; max-height:25vh }
      .qa p { margin:6px 0 }
    }
    canvas { position:fixed; inset:0 }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="Seni eye and movement preview"></canvas>
  <fieldset class="qa" id="preview-controls" disabled>
    <h1>Seni · Movement &amp; expressions</h1>
    <label for="eye-style">Eyes</label><select id="eye-style">
      <option value="auto" selected>Conversation mix</option>
      <option value="current">Current eyes</option>
      <option value="relaxed">Soft and settled</option>
      <option value="attentive">Open and attentive</option>
    </select>
    <p><label><input id="eye-moments" type="checkbox" checked> Eye moments</label> — switch off to hold the resting style.</p>
    <div class="controls">
      <section class="timing-comparison" aria-label="Expression performances">
        <h2>Updated expressions</h2>
        <div class="timing-options">
          <label><input id="timing-speech" type="checkbox"> With cached speech</label>
          <button id="watch-all">Watch all</button>
          <button id="replay">Replay</button>
        </div>
        <nav aria-label="Expression examples">
          <button id="timing-confidently">Confidently</button>
          <button id="timing-concerned">Concerned</button>
          <button id="timing-curious">Curious</button>
          <button id="timing-thoughtful">Thoughtful</button>
          <button id="timing-warmly">Warmly</button>
          <button id="timing-chuckle">Chuckle</button>
          <button id="timing-laughing">Laughing</button>
          <button id="timing-sighs">Sighs</button>
          <button id="timing-cheerful">Cheerful</button>
          <button id="timing-excited">Excited</button>
        </nav>
        <p id="timing-status" role="status">Loading expressions…</p>
        <p>Watch the arrival, the quieter hold and the particles settling back. Silent by default; the speech option uses the same existing recording for each expression.</p>
      </section>
      <nav aria-label="Movement examples">
        <button id="neutral">Neutral</button>
        <button id="listening">Simulate your turn</button>
        <button id="speech">Play cached speech</button>
        <button id="stop">Stop</button>
      </nav>
      <details><summary>Diagnostics</summary><pre id="metrics">Loading…</pre></details>
    </div>
  </fieldset>
  <script type="module" src="./js/movement-preview.js"></script>
</body>
</html>
